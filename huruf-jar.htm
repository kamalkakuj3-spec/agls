<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حُرُوفُ الْجَرِّ | ১৭টি হারফে জার</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#0a3b2c;--green:#12805a;--mint:#dff1e7;--paper:#f7f4ea;--white:#fff;--text:#16261f;--mute:#5c6f66;--line:#cfe3d7}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--text);font-family:'Hind Siliguri',system-ui,sans-serif;line-height:1.7;
background-image:radial-gradient(circle at 1px 1px,rgba(18,128,90,.09) 1px,transparent 0);background-size:26px 26px}
:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{background:linear-gradient(160deg,var(--deep),#0f5c43 70%,var(--green));color:#fff;text-align:center;padding:60px 20px 90px;border-radius:0 0 50% 50%/0 0 36px 36px;position:relative;overflow:hidden}
header::before,header::after{content:"";position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.12)}
header::before{width:420px;height:420px;top:-200px;left:-120px}header::after{width:320px;height:320px;bottom:-190px;right:-80px}
.ar{font-family:Amiri,serif;direction:rtl}
header .ar{font-size:clamp(44px,9vw,84px);line-height:1.5;text-shadow:0 6px 30px rgba(0,0,0,.3);position:relative}
header h1{font-size:clamp(24px,4.4vw,38px);font-weight:700;position:relative}
header p{opacity:.85;font-size:19px;margin-top:6px;position:relative}
.bar{margin:-34px auto 0;max-width:620px;display:flex;gap:12px;padding:0 20px;position:relative}
.bar input{flex:1;padding:15px 22px;border-radius:999px;border:1px solid var(--line);background:var(--white);font:inherit;font-size:18px;box-shadow:0 10px 30px -12px rgba(10,59,44,.35)}
.bar input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px rgba(18,128,90,.18)}
.bar button{padding:0 22px;border-radius:999px;border:0;background:var(--green);color:#fff;font:inherit;font-size:17px;font-weight:600;cursor:pointer;box-shadow:0 10px 24px -10px rgba(18,128,90,.8);transition:background .2s}
.bar button[aria-pressed=true]{background:var(--deep)}
.count{text-align:center;color:var(--mute);margin:18px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding:26px 0}
.card{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 14px 34px -22px rgba(10,59,44,.45);transition:transform .25s,box-shadow .25s,border-color .25s;will-change:transform}
.card:hover{border-color:var(--green);box-shadow:0 26px 50px -24px rgba(18,128,90,.55)}
.row{display:flex;align-items:center;gap:16px}
.num{flex:none;width:36px;height:36px;border-radius:50%;background:var(--mint);color:var(--deep);display:grid;place-items:center;font-weight:700}
.big{flex:1;text-align:center;font-family:Amiri,serif;font-size:62px;line-height:1.3;color:var(--deep)}
.say{flex:none;font-size:15px;color:var(--green);font-weight:600;min-width:52px;text-align:right}
.body{margin-top:12px;padding-top:14px;border-top:1px dashed var(--line);transition:filter .25s}
.mean{font-size:19px;font-weight:600}
.mean small{display:block;font-size:14px;color:var(--mute);font-weight:500}
.ex{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--mint)}
.ex .ar{font-size:27px;line-height:1.6;color:var(--deep)}
.ex span{font-size:16px;color:var(--mute)}
.quiz .card:not(.show) .body{filter:blur(9px);cursor:pointer;user-select:none}
.quiz .card:not(.show)::after{content:"দেখতে ট্যাপ করুন";display:block;text-align:center;color:var(--green);font-size:14px;margin-top:-52px;position:relative;pointer-events:none;font-weight:600}
.note{margin:6px 0 60px;padding:24px 26px;border-radius:22px;background:var(--deep);color:#e7f4ec}
.note h2{font-size:22px;margin-bottom:8px}
.note li{margin-left:20px;font-size:18px}
.empty{display:none;text-align:center;color:var(--mute);padding:30px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="ar">حُرُوفُ الْجَرِّ</div>
  <h1>১৭টি হারফে জার ও তার অর্থ</h1>
  <p>উচ্চারণ, বাংলা অর্থ ও উদাহরণসহ</p>
</header>

<div class="bar">
  <input id="q" type="search" placeholder="হরফ বা অর্থ লিখে খুঁজুন…" aria-label="খুঁজুন">
  <button id="mode" aria-pressed="false">মুখস্থ মোড</button>
</div>
<p class="count" id="count"></p>

<main class="wrap">
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">কিছু পাওয়া যায়নি।</div>
  <section class="note">
    <h2>গুরুত্বপূর্ণ তথ্য</h2>
    <ul>
      <li>হারফে জারের পরে আসা শব্দ মজরুর হয়, অর্থাৎ সাধারণত শব্দের শেষে যের (ـِ) যুক্ত হয়।</li>
      <li>এগুলো বাক্যে স্থান, সময়, উপায় ইত্যাদি নির্দিষ্ট অর্থ প্রকাশ করে।</li>
    </ul>
  </section>
</main>

<script>
var D=[
["بِ","বি","সহ, সাথে, দ্বারা, সঙ্গে","بِالْقَلَمِ كَتَبَتْ","কলম দ্বারা সে লিখেছে।"],
["تَ","তা","কসম, শপথ","تَاللَّهِ","আল্লাহর কসম!"],
["كَ","কা","মতো, হিসেবে","كَالْأَسَدِ","সিংহের মতো।"],
["لِ","লি","জন্য, জন্যে","لِلطَّالِبِ","ছাত্রের জন্য।"],
["وَ","ওয়া","কসম, শপথ","وَاللَّهِ / وَالتِّينِ وَالزَّيْتُونِ","আল্লাহর কসম! / তীন ও জলপাইয়ের শপথ!"],
["مُنْذُ","মুনযু","থেকে, হতে (সময়ের ক্ষেত্রে)","مُنْذُ أَمْسِ","গতকাল থেকে।"],
["مُذْ","মুযু","থেকে (সময়ের ক্ষেত্রে)","مُذْ يَوْمَيْنِ","দুই দিন থেকে।"],
["خَلَا","খালা","ব্যতীত, বাদে","جَاءَ النَّاسُ خَلَا زَيْدٍ","জায়েদ ব্যতীত সবাই এল।"],
["رُبَّ","রুব্বা","কখনও, কিছু, অনেক সময়","رُبَّ رَجُلٍ","কখনও একজন ব্যক্তি।"],
["حَاشَا","হাশা","ছাড়া","جَاءَ النَّاسُ حَاشَا زَيْدٍ","জায়েদ ছাড়া সবাই এল।"],
["مِنْ","মিন","থেকে, হতে","مِنَ الْمَسْجِدِ","মসজিদ থেকে।"],
["عَدَا","আদা","ব্যতীত, বাদে","جَاءَ الْقَوْمُ عَدَا زَيْدٍ","জায়েদ বাদে লোকেরা এল।"],
["فِي","ফী","মধ্যে","فِي الْبَيْتِ","বাড়ির মধ্যে।"],
["عَنْ","আন","সম্পর্কে, থেকে","عَنْهُ","তার সম্পর্কে।"],
["عَلَى","আলা","উপর","عَلَى السَّرِيرِ","বিছানার উপর।"],
["حَتَّى","হাত্তা","পর্যন্ত","حَتَّى النَّهَارِ","দিন পর্যন্ত।"],
["إِلَى","ইলা","দিকে, পর্যন্ত","إِلَى السُّوقِ","বাজার পর্যন্ত।"]
];
var bn="০১২৩৪৫৬৭৮৯";function tb(n){return String(n).replace(/\d/g,function(d){return bn[d]})}
var g=document.getElementById("grid"),cards=[];
D.forEach(function(d,i){
  var c=document.createElement("article");c.className="card";
  c.dataset.k=(d[0]+" "+d[1]+" "+d[2]).toLowerCase();
  c.innerHTML='<div class="row"><div class="num"></div><div class="big ar"></div><div class="say"></div></div><div class="body"><div class="mean"></div><div class="ex"><div class="ar"></div><span></span></div></div>';
  c.querySelector(".num").textContent=tb(i+1);c.querySelector(".big").textContent=d[0];
  c.querySelector(".say").textContent=d[1];c.querySelector(".mean").textContent="অর্থ: "+d[2];
  c.querySelector(".ex .ar").textContent=d[3];c.querySelector(".ex span").textContent=d[4];
  c.addEventListener("click",function(){if(document.body.classList.contains("quiz"))c.classList.toggle("show")});
  c.addEventListener("pointermove",function(e){var r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform="perspective(800px) rotateY("+x*7+"deg) rotateX("+(-y*7)+"deg) translateY(-4px)"});
  c.addEventListener("pointerleave",function(){c.style.transform=""});
  g.appendChild(c);cards.push(c);
});
function upd(){var v=document.getElementById("q").value.trim().toLowerCase(),n=0;
  cards.forEach(function(c){var ok=!v||c.dataset.k.indexOf(v)>-1;c.style.display=ok?"":"none";if(ok)n++});
  document.getElementById("count").textContent="মোট "+tb(n)+"টি হারফে জার";
  document.getElementById("empty").style.display=n?"none":"block"}
document.getElementById("q").addEventListener("input",upd);upd();
var m=document.getElementById("mode");
m.addEventListener("click",function(){var on=document.body.classList.toggle("quiz");m.setAttribute("aria-pressed",on);m.textContent=on?"সব দেখান":"মুখস্থ মোড";cards.forEach(function(c){c.classList.remove("show")})});
</script>
</body>
</html>
